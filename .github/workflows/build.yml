name: Build Uranium

on:
  push:
    branches:
      - main
      - uranium-clean-rebuild
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Geode mod
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Geode mod for Windows
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Win64
          combine: true

  build-android32:
    name: Build Android 32-bit Geode mod
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Geode mod for Android 32-bit
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Android32
          combine: true

  build-android64:
    name: Build Android 64-bit Geode mod
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Geode mod for Android 64-bit
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Android64
          combine: true
